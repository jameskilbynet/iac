---
# Throwaway diagnostic: shows what a Semaphore variable group actually delivered
# to a run. Values are never printed, only lengths and a 4-character prefix, so
# it is safe to run against a template holding real secrets.
#
# Point a Semaphore template at this file, attach the same variable group as the
# bundle server template, and run it. Delete once the credential arrives.
- name: Show what this run received
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Credential sources, masked
      ansible.builtin.debug:
        msg:
          - "extra var vcf_upload_password_hash: defined={{ vcf_upload_password_hash is defined }} len={{ vcf_upload_password_hash | default('') | length }} starts={{ (vcf_upload_password_hash | default(''))[:4] }}"
          - "env var VCF_UPLOAD_PASSWORD_HASH: len={{ lookup('env', 'VCF_UPLOAD_PASSWORD_HASH') | length }} starts={{ lookup('env', 'VCF_UPLOAD_PASSWORD_HASH')[:4] }}"
          - "extra var vcf_upload_password: defined={{ vcf_upload_password is defined }} len={{ vcf_upload_password | default('') | length }}"
          - "env var VCF_UPLOAD_PASSWORD: len={{ lookup('env', 'VCF_UPLOAD_PASSWORD') | length }}"
          - "extra var vcf_upload_user: defined={{ vcf_upload_user is defined }} value={{ vcf_upload_user | default('(unset)') }}"

    - name: Variable names this play received mentioning vcf, upload or password
      ansible.builtin.debug:
        msg: "{{ q('varnames', '(?i)vcf|upload|passw') | sort }}"

    - name: Controller environment variable names mentioning VCF, UPLOAD or PASS
      ansible.builtin.debug:
        msg:
          names: "{{ lookup('pipe', 'env | cut -d= -f1 | grep -iE ' ~ regex ~ ' | sort || true')
                     | split('\n') | reject('equalto', '') | list }}"
          total_env_vars: "{{ lookup('pipe', 'env | wc -l') | trim }}"
      vars:
        regex: "'vcf|upload|pass'"
